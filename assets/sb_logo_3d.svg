<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Metallic Gradient: Electric Cyan -> Cobalt -> Violet -> Magenta -->
    <linearGradient id="sbFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Specular Bevel Top Highlight -->
    <linearGradient id="sbBevelTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.65"/>
    </linearGradient>

    <!-- 3D Shadow Underside Extrusion Gradient -->
    <linearGradient id="sbExtrudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>

    <!-- Shield Facet Gradient (Semi-transparent 3D Glass Layer) -->
    <linearGradient id="sbShieldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Radial Core Flare -->
    <radialGradient id="sbCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="sbNeonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Central Core Halo -->
  <circle cx="60" cy="60" r="44" fill="url(#sbCoreGlow)"/>

  <!-- Outer 3D Hexagonal Shield Frame -->
  <!-- Shadow Extrusion for Shield -->
  <polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="url(#sbShieldBack)" stroke="url(#sbFrontGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Inner Shield Accent Line -->
  <polygon points="60,12 102,36 102,84 60,108 18,84 18,36" fill="none" stroke="url(#sbBevelTop)" stroke-width="1" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- ==============================================
       LETTER "S" — 3D FACETED BEVELED RIBBON
       ============================================== -->
  <!-- "S" Extrusion / 3D Depth Layer (Lower) -->
  <path d="M 52 30 L 37 30 C 28 30 22 36 22 44 C 22 52 28 58 37 58 L 50 58 C 56 58 60 62 60 68 C 60 74 55 79 47 79 L 28 79" 
        stroke="url(#sbExtrudeGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5, 3)"/>

  <!-- "S" Main Front Facet -->
  <path d="M 52 30 L 37 30 C 28 30 22 36 22 44 C 22 52 28 58 37 58 L 50 58 C 56 58 60 62 60 68 C 60 74 55 79 47 79 L 28 79" 
        stroke="url(#sbFrontGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "S" Specular Top Bevel Edge -->
  <path d="M 50 27.5 L 37 27.5 C 26 27.5 20 34 20 42 C 20 50 26 56 36 56 L 49 56" 
        stroke="url(#sbBevelTop)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==============================================
       LETTER "B" — 3D FACETED BEVELED RIBBON
       ============================================== -->
  <!-- "B" Extrusion / 3D Depth Layer (Lower) -->
  <!-- B Spine 3D Shadow -->
  <line x1="64" y1="30" x2="64" y2="90" stroke="url(#sbExtrudeGrad)" stroke-width="8.5" stroke-linecap="round" transform="translate(1.5, 3)"/>
  <!-- B Upper Loop 3D Shadow -->
  <path d="M 64 30 L 84 30 C 92 30 99 36 99 45 C 99 53 92 59 84 59 L 64 59" 
        stroke="url(#sbExtrudeGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5, 3)"/>
  <!-- B Lower Loop 3D Shadow -->
  <path d="M 64 59 L 87 59 C 96 59 103 66 103 75 C 103 84 96 90 87 90 L 64 90" 
        stroke="url(#sbExtrudeGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(1.5, 3)"/>

  <!-- "B" Main Front Facet -->
  <!-- B Spine -->
  <line x1="64" y1="30" x2="64" y2="90" stroke="url(#sbFrontGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- B Upper Loop -->
  <path d="M 64 30 L 84 30 C 92 30 99 36 99 45 C 99 53 92 59 84 59 L 64 59" 
        stroke="url(#sbFrontGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- B Lower Loop -->
  <path d="M 64 59 L 87 59 C 96 59 103 66 103 75 C 103 84 96 90 87 90 L 64 90" 
        stroke="url(#sbFrontGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "B" Specular Top Bevel Edge -->
  <line x1="62" y1="31" x2="62" y2="89" stroke="url(#sbBevelTop)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 64 27.5 L 84 27.5 C 93 27.5 101 34 101 44" stroke="url(#sbBevelTop)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 64 56.5 L 87 56.5 C 97 56.5 105 64 105 74" stroke="url(#sbBevelTop)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ==============================================
       3D CYBER CORNER NODES & STAR GLINTS
       ============================================== -->
  <circle cx="60" cy="6" r="3" fill="#ffffff" filter="url(#sbNeonFilter)"/>
  <circle cx="108" cy="33" r="3" fill="#38bdf8"/>
  <circle cx="108" cy="87" r="3" fill="#7c3aed"/>
  <circle cx="60" cy="114" r="3" fill="#ec4899"/>
  <circle cx="12" cy="87" r="3" fill="#38bdf8"/>
  <circle cx="12" cy="33" r="3" fill="#00f2fe"/>

  <!-- Specular 4-point Sparkle at Top-Left of 'S' -->
  <path d="M 37 19 Q 37 24 42 24 Q 37 24 37 29 Q 37 24 32 24 Q 37 24 37 19 Z" fill="#ffffff" opacity="0.9"/>
</svg>
